<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">
        <div class="text-center mb-4">
          <h2 class="fw-bold text-dark mb-2">Forgot Password</h2>
          <p class="text-muted small">Enter your registered Email to receive a new login password.</p>
        </div>

        @if (!isSuccess) {
          <form (ngSubmit)="resetPassword()">
            <div class="form-group mb-3">
              <label class="form-label fw-semibold small" for="forgotInput">Email Id</label>
              <input
                type="text"
                [(ngModel)]="forgotInput"
                name="forgotInput"
                class="form-control form-control-lg rounded-3 fs-6"
                id="forgotInput"
                placeholder="e.g. name@example.com or 9876543210"
                [disabled]="isSubmitting"
                required
              >
            </div>

            <div class="d-flex align-items-center mb-4 gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="roleType" id="roleStudent" [value]="false" [(ngModel)]="isTeacher">
                <label class="form-check-label small" for="roleStudent">Student</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="roleType" id="roleTeacher" [value]="true" [(ngModel)]="isTeacher">
                <label class="form-check-label small" for="roleTeacher">Teacher</label>
              </div>
            </div>

            <button type="submit" class="btn btn-success btn-lg w-100 rounded-3 fw-semibold fs-6 py-2" [disabled]="isSubmitting">
              @if (isSubmitting) {
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                <span>Sending Password...</span>
              } @else {
                <span>Send Reset Link / Password</span>
              }
            </button>
          </form>
        } @else {
          <div class="text-center py-3">
            <div class="mb-3 text-success">
              <i class="fa fa-check-circle fa-3x"></i>
            </div>
            <h5 class="fw-bold text-success mb-2">Password Sent Successfully!</h5>
            <p class="text-muted small mb-4">{{ successMessage }}</p>
            <button type="button" class="btn btn-outline-success rounded-3 px-4" (click)="goToLogin()">
              Back to Home / Login
            </button>
          </div>
        }

        <div class="text-center mt-4">
          <a routerLink="/home" class="text-decoration-none small text-muted">
            <i class="fa fa-arrow-left me-1"></i> Back to Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
