<div class="myaccount-layout">
    <!-- Fixed Top-Left Sidebar -->
    <nav id="sidebarMenu" class="sidebar collapse d-lg-block bg-white shadow-sm">
        <!-- Sidebar Header with Logo and Tagline -->
        <div class="sidebar-brand text-start mb-4">
            <div class="d-flex align-items-center gap-2 mb-1">
                <i class="fas fa-graduation-cap brand-logo-icon"></i>
                <span class="brand-logo-text">eTutor</span>
            </div>
            <div class="brand-tagline">Learn. Grow. Succeed.</div>
        </div>

        <!-- Navigation Links -->
        <ul class="nav flex-column sidebar-nav p-0 m-0">
            @for (menu of sidebarMenus; let i = $index; track menu.title) {
            <li class="nav-item mb-2">
                <a class="sidebar-link cursor d-flex align-items-center" 
                   [class.active]="menu.active"
                   (click)="navigation(menu, i)">
                    <i [class]="menu.icon" class="sidebar-icon me-3"></i>
                    <span class="sidebar-title">{{menu.title}}</span>
                </a>
            </li>
            }
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="myaccount-main-content">
        <!-- Teacher Verification Status Banners -->
        <ng-container *ngIf="auth.isTeacherUser">



            <!-- Action Required / Application Rejected (Status 2) -->
            <div *ngIf="auth.teacherVerificationStatus == '2'" class="alert alert-danger border-0 shadow-sm rounded-3 p-3 mb-3">
                <div class="d-flex align-items-start justify-content-between">
                    <div class="d-flex align-items-start">
                        <i class="fas fa-exclamation-triangle fa-2x text-danger me-3 mt-1"></i>
                        <div>
                            <h6 class="fw-bold mb-1 text-danger"><i class="fas fa-file-excel me-1"></i> Action Required: Application Verification Declined</h6>
                            <p class="mb-2 text-dark" style="font-size: 13px;">
                                <strong>Admin Review Notes:</strong> {{auth.teacherRejectionNotes}}
                            </p>
                            <button class="btn btn-sm btn-danger rounded-pill px-3 font-weight-bold shadow-sm" (click)="navigateToGeneral()">
                                <i class="fas fa-file-upload me-1"></i> Update & Re-upload Documents
                            </button>
                        </div>
                    </div>
                    <span class="badge bg-danger px-3 py-2 fs-6 rounded-pill shadow-sm"><i class="fas fa-ban me-1"></i> Action Required</span>
                </div>
            </div>
        </ng-container>

        <router-outlet />
    </main>
</div>
