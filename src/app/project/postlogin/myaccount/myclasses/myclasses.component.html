<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-12 rounded-border table-container">
            <h5>Today's Classes</h5>
            <div class="d-flex justify-content-between align-items-center mb-3 bg-light p-3 rounded-border border shadow-sm">
                <div>
                    <button class="btn btn-outline-secondary btn-sm me-2">&laquo;</button>
                    <span class="font-weight-bold">02 - 08 March</span>
                    <button class="btn btn-outline-secondary btn-sm ms-2">&raquo;</button>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <i class="fas fa-globe text-primary me-1"></i>
                    <span class="font-weight-bold" style="font-size: 13px;">Timezone:</span>
                    <select class="form-select form-select-sm w-auto d-inline-block border-primary font-weight-bold shadow-sm" [(ngModel)]="selectedTimezone">
                        <option *ngFor="let tz of timezoneList" [value]="tz.code">{{tz.name}} ({{tz.offset}})</option>
                    </select>
                </div>
            </div>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Mon 02</th>
                        <th>Tues 03</th>
                        <th>Wed 04</th>
                        <th>Thu 05</th>
                        <th>Fri 06</th>
                        <th>Sat 07</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>09:00</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>10:00</td>
                        <td class="available text-center">
                            <div class="fw-bold text-success mb-1"><i class="fas fa-video me-1"></i> Class Live</div>
                            <button class="btn btn-sm btn-primary px-3 shadow-sm rounded-pill font-weight-bold" (click)="joinClass('Mathematics - Algebra', '10:00 AM')">
                                <i class="fas fa-headset me-1"></i> Join Live Room
                            </button>
                            <small class="d-block text-muted mt-1">Mon - Thu 10:00 am</small>
                        </td>
                        <td></td>
                        <td></td>
                        <td class="cancel">
                            <div>Cancel</div>
                            <small>Mon - Thu 10:00 am</small>
                        </td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>11:00</td>
                        <td></td>
                        <td></td>
                        <td class="available text-center">
                            <div class="fw-bold text-success mb-1"><i class="fas fa-video me-1"></i> Class Live</div>
                            <button class="btn btn-sm btn-success px-3 shadow-sm rounded-pill font-weight-bold" (click)="joinClass('English - Grammar', '11:00 AM')">
                                <i class="fas fa-video me-1"></i> Join Live Room
                            </button>
                            <small class="d-block text-muted mt-1">Wed 11:00 am</small>
                        </td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>12:00</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>13:00</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>14:00</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>15:00</td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Embedded Live Classroom Modal -->
<app-live-classroom-modal
  [isOpen]="isLiveClassOpen"
  [roomName]="activeRoomName"
  [roomTitle]="activeRoomTitle"
  [userName]="currentUserName"
  (onClose)="closeLiveClass()">
</app-live-classroom-modal>
