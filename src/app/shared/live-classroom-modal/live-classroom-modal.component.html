<div class="live-classroom-backdrop" *ngIf="isOpen" (click)="closeModal()">
  <div class="live-classroom-modal" (click)="$event.stopPropagation()">
    <!-- Modal Header -->
    <div class="modal-header d-flex justify-content-between align-items-center px-4 py-3">
      <div class="d-flex align-items-center gap-2">
        <span class="pulse-indicator"></span>
        <h5 class="m-0 room-title text-white font-weight-bold">
          <i class="fas fa-video me-2 text-danger"></i>
          {{ roomTitle || 'Virtual Live Classroom' }}
        </h5>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-success px-3 py-2 rounded-pill"><i class="fas fa-shield-alt me-1"></i> Live WebRTC Session</span>
        <button type="button" class="btn-close btn-close-white" (click)="closeModal()" aria-label="Close"></button>
      </div>
    </div>

    <!-- Jitsi Container -->
    <div class="modal-body p-0">
      <div #jitsiContainer class="jitsi-container"></div>
    </div>
  </div>
</div>
